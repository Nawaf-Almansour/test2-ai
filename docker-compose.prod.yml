version: '3.8'

services:
  # Nginx reverse proxy (main entrypoint)
  nginx:
    image: nginx:1.27.2-alpine3.20
    container_name: school-platform-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - school-platform-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Frontend (React SPA)
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_NODE_ENV=production
    container_name: school-platform-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - school-platform-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Backend (NestJS API)
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: school-platform-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/school-platform?authSource=admin
      FRONTEND_URL: ${FRONTEND_URL:-https://your-domain.com}
      THROTTLER_TTL: 600000
      THROTTLER_LIMIT: 10
      SWAGGER_ENABLED: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - school-platform-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # MongoDB Database
  mongodb:
    image: mongo:7.0.15-jammy
    container_name: school-platform-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: school-platform
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - school-platform-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  mongodb_data:
    driver: local
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local

networks:
  school-platform-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16