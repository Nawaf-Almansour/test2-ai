version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: school-platform-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: school-platform
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - school-platform-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.dev
    container_name: school-platform-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      MONGODB_URI: mongodb://admin:password@mongodb:27017/school-platform?authSource=admin
      FRONTEND_URL: http://localhost:3000
      THROTTLER_TTL: 600000
      THROTTLER_LIMIT: 10
    volumes:
      - ./packages/backend:/app/packages/backend
      - ./package.json:/app/package.json
      - /app/node_modules
      - /app/packages/backend/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - school-platform-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile.dev
    container_name: school-platform-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_NODE_ENV: development
    volumes:
      - ./packages/frontend:/app/packages/frontend
      - ./package.json:/app/package.json
      - /app/node_modules
      - /app/packages/frontend/node_modules
    depends_on:
      - backend
    networks:
      - school-platform-network

volumes:
  mongodb_data:
    driver: local

networks:
  school-platform-network:
    driver: bridge